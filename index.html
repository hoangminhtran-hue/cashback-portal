<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cashback Permission Portal</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#161f38; --panel2:#1c2745; --border:#2a3556;
    --text:#e5e9f5; --muted:#8b93b0; --accent:#22c55e; --accent2:#3b82f6; --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  /* ---------- LOGIN ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center;}
  .login-card h1{font-size:20px;margin:0 0 6px;}
  .login-card p{color:var(--muted);font-size:13px;margin:0 0 28px;}
  .g-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:none;
    padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;width:100%;}
  .g-btn:hover{background:#f3f4f6;}
  .login-error{color:var(--danger);font-size:13px;margin-top:14px;}
  /* ---------- APP SHELL ---------- */
  #app-shell{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
  #app-shell.show{display:grid;}
  aside{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;}
  aside .brand{font-weight:700;font-size:15px;padding:6px 10px 18px;}
  aside .brand span{color:var(--accent);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);
    cursor:pointer;font-size:14px;margin-bottom:2px;}
  .nav-item:hover{background:var(--panel2);color:var(--text);}
  .nav-item.active{background:var(--panel2);color:var(--text);border-left:3px solid var(--accent);}
  .nav-section{font-size:11px;text-transform:uppercase;color:#5b6588;margin:16px 10px 6px;letter-spacing:.05em;}
  .user-box{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}
  .user-box b{color:var(--text);display:block;font-size:13px;}
  .logout-link{color:var(--danger);cursor:pointer;font-size:12px;margin-top:6px;display:inline-block;}
  main{padding:24px 28px;overflow-x:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .topbar h2{margin:0;font-size:20px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#1d4ed81a;color:#60a5fa;margin-left:8px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .card .value{font-size:22px;font-weight:700;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px;}
  .panel h3{margin:0 0 14px;font-size:14px;color:var(--muted);font-weight:600;}
  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filters input,.filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:6px;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);}
  .tablewrap{max-height:60vh;overflow:auto;border-radius:8px;}
  .empty{text-align:center;color:var(--muted);padding:30px;}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .pill.ok{background:#16a34a26;color:#4ade80;}
  .pill.no{background:#ef444426;color:#f87171;}
  canvas{max-height:280px;}
  .brand-logo{padding:10px 10px 22px;line-height:1;}
  .spx-main{font-size:26px;font-weight:800;color:#F0501B;letter-spacing:1px;}
  .spx-sub{display:block;font-size:10px;font-weight:700;color:#F0501B;letter-spacing:4px;margin-top:2px;}
  .scope-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .scope-label{font-size:12px;color:var(--muted);white-space:nowrap;}
  .pill-group{display:flex;gap:6px;flex-wrap:wrap;}
  .pill-btn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;
    border-radius:999px;font-size:12px;cursor:pointer;transition:all .15s;}
  .pill-btn:hover{border-color:var(--accent);color:var(--text);}
  .pill-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700;}
  #scope-bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:999px;padding:9px 18px;margin-bottom:20px;flex-wrap:wrap;font-size:13px;}
  .team-chip{border:1px solid #2dd4bf;color:#2dd4bf;background:#2dd4bf1f;padding:5px 14px;border-radius:999px;
    font-weight:700;font-size:12px;}
  .role-pill{background:#f0501b26;color:#ff8a4c;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;}
  .scope-note{color:var(--muted);font-size:12px;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:var(--panel2);}
  .card{transition:all .15s;cursor:default;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35);}
  .panel{transition:border-color .15s;}
  .panel:hover{border-color:#37436b;}
</style>
</head>

<script>
  // ================= CONFIG - BẠN CẦN ĐIỀN =================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcpNawaDmyLynnrswYMJ1NjjBQiwNpbevvFSeWgmSbbLkTlVmQ4IgF82YfEuvOurrqYQ/exec';
  const firebaseConfig = {
    apiKey: "AIzaSyASfq4MxTPzbvoZ0Hx1XqKBvMfmhIY-u1Y",
    authDomain: "cashback-portal-d4646.firebaseapp.com",
    projectId: "cashback-portal-d4646"
  };
  const RESTRICT_DOMAIN = "spxexpress.com"; // gợi ý chọn đúng tài khoản domain khi bấm đăng nhập
  // ===========================================================

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  let currentAuth = null;   // { email, team, role, name }
  let currentRows = [];
  let currentHeaders = [];
  let scopeTeam = '';       // '' = xem tất cả (chỉ Admin); Leader luôn cố định = team của họ
  let currentView = 'overview';

  function api(action, email) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      window[cbName] = function(data) {
        resolve(data);
        delete window[cbName];
        script.remove();
      };
      const script = document.createElement('script');
      script.src = APPS_SCRIPT_URL + '?action=' + action + '&email=' + encodeURIComponent(email) + '&callback=' + cbName;
      script.onerror = function() {
        reject(new Error('Không tải được dữ liệu từ Apps Script (kiểm tra APPS_SCRIPT_URL và deploy Anyone).'));
        delete window[cbName];
        script.remove();
      };
      document.body.appendChild(script);
    });
  }

  function doGoogleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ hd: RESTRICT_DOMAIN });
    document.getElementById('login-error').innerText = '';
    auth.signInWithPopup(provider)
      .then(result => afterFirebaseLogin(result.user.email))
      .catch(err => { document.getElementById('login-error').innerText = 'Lỗi đăng nhập Google: ' + err.message; });
  }

  function afterFirebaseLogin(email) {
    api('login', email).then(auth1 => {
      if (!auth1.success) {
        document.getElementById('login-error').innerText = auth1.message;
        firebase.auth().signOut();
        return;
      }
      currentAuth = auth1;
      loadDashboard();
    }).catch(err => {
      document.getElementById('login-error').innerText = 'Lỗi hệ thống: không gọi được API. Kiểm tra APPS_SCRIPT_URL.';
    });
  }

  function loadDashboard() {
    api('data', currentAuth.email).then(res => {
      if (!res.success) { alert(res.message); return; }
      currentRows = res.rows;
      currentHeaders = res.headers;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('show');
      document.getElementById('side-name').innerText = currentAuth.name;
      document.getElementById('side-email').innerText = currentAuth.email;
      document.getElementById('team-badge').innerText = currentAuth.role === 'Admin' ? 'Admin - Tất cả team' : 'Team ' + currentAuth.team;
      if (currentAuth.role === 'Admin') document.getElementById('admin-nav').style.display = 'block';
      scopeTeam = currentAuth.role === 'Admin' ? '' : currentAuth.team;
      renderScopeBar();
      renderView('overview');
    });
  }

  function doLogout() {
    firebase.auth().signOut();
    currentAuth = null;
    document.getElementById('app-shell').classList.remove('show');
    document.getElementById('login-screen').style.display = 'flex';
  }

  // ---------------- Sidebar nav ----------------
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      renderView(el.dataset.view);
    });
  });

  const TITLES = {
    overview: 'Tổng quan', ado: 'Cashback ADO', eligible: 'Eligible List',
    fd: 'Đền bù (FD compensation)', all: 'Tất cả dữ liệu',
    accesslist: 'Quản lý quyền truy cập', auditlog: 'Nhật ký truy cập'
  };

  function renderScopeBar() {
    const el = document.getElementById('scope-bar');
    const isAdmin = currentAuth.role === 'Admin';
    const allTeams = [...new Set(currentRows.map(r => r['Team']).filter(Boolean))].sort();

    const teamPartHtml = isAdmin
      ? '<div class="pill-group" id="scope-pills">' +
          '<button class="pill-btn ' + (scopeTeam === '' ? 'active' : '') + '" data-team="">Tất cả (' + allTeams.length + ' team)</button>' +
          allTeams.map(t => '<button class="pill-btn ' + (scopeTeam === t ? 'active' : '') + '" data-team="' + t + '">' + t + '</button>').join('') +
        '</div>'
      : '<span class="team-chip">' + currentAuth.team + '</span>';

    const roleHtml = '<span class="role-pill">👑 ' + (isAdmin ? 'Admin' : 'Lead/SubLead') + '</span>';
    const noteHtml = isAdmin
      ? '<span class="scope-note">Toàn quyền xem &amp; lọc theo từng team.</span>'
      : '<span class="scope-note">🔒 Bạn chỉ quản lý được team được phân công.</span>';

    el.innerHTML = '<span class="scope-label">🌐 Phạm vi xem &amp; xử lý:</span>' + teamPartHtml + roleHtml + noteHtml;

    if (isAdmin) {
      document.querySelectorAll('#scope-pills .pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          scopeTeam = btn.dataset.team;
          renderScopeBar();
          renderView(currentView);
        });
      });
    }
  }

  function renderView(view) {
    currentView = view;
    document.getElementById('view-title').innerHTML = TITLES[view] + ' <span class="badge" id="team-badge2">' +
      (currentAuth.role === 'Admin' ? 'Admin' : 'Team ' + currentAuth.team) + '</span>';
    const el = document.getElementById('view-content');
    el.innerHTML = '';

    const scopedRows = scopeTeam ? currentRows.filter(r => r['Team'] === scopeTeam) : currentRows;

    if (view === 'overview') return renderOverview(el, scopedRows);
    if (view === 'accesslist') return renderAccessList(el);
    if (view === 'auditlog') return renderAuditLog(el);

    // ado / eligible / fd / all -> bảng dữ liệu có filter theo loại, đã áp dụng scopeTeam ở trên
    const typeMap = { ado: 'ADO', eligible: 'Eligible', fd: 'bù' };
    const filterWord = typeMap[view];
    const rows = filterWord ? scopedRows.filter(r => (r['Cashback Type'] || '').includes(filterWord)) : scopedRows;
    renderTablePanel(el, rows, currentHeaders);
  }

  function money(n){ return (Number(n)||0).toLocaleString('vi-VN'); }

  function renderOverview(el, rows) {
    const total = rows.length;
    const sum = rows.reduce((s, r) => s + (Number(r['Số tiền chi trả (Kết quả BI)']) || 0), 0);
    const byType = {};
    rows.forEach(r => {
      const t = r['Cashback Type'] || 'Khác';
      byType[t] = (byType[t] || 0) + (Number(r['Số tiền chi trả (Kết quả BI)']) || 0);
    });

    el.innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">Tổng số dòng</div><div class="value">${total}</div></div>
        <div class="card"><div class="label">Tổng tiền chi trả</div><div class="value">${money(sum)}</div></div>
        <div class="card"><div class="label">Số loại Cashback</div><div class="value">${Object.keys(byType).length}</div></div>
      </div>
      <div class="panel"><h3>Tổng tiền theo loại Cashback</h3><canvas id="chart1"></canvas></div>
    `;
    const ctx = document.getElementById('chart1').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Object.keys(byType),
        datasets: [{ label: 'Tổng tiền', data: Object.values(byType), backgroundColor: '#22c55e' }]
      },
      options: { plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#8b93b0' } }, y: { ticks: { color: '#8b93b0' } } } }
    });
  }

  function renderTablePanel(el, rows, headers) {
    el.innerHTML = `
      <div class="panel">
        <div class="filters">
          <input type="text" id="search-box" placeholder="Tìm kiếm...">
        </div>
        <div class="tablewrap">
          <table><thead><tr>${headers.map(h => '<th>' + h + '</th>').join('')}</tr></thead>
          <tbody id="tbody"></tbody></table>
          <div class="empty" id="empty-msg" style="display:none;">Không có dữ liệu.</div>
        </div>
      </div>`;
    function draw() {
      const q = document.getElementById('search-box').value.toLowerCase();
      const filtered = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
      document.getElementById('tbody').innerHTML = filtered.map(r =>
        '<tr>' + headers.map(h => '<td>' + (r[h] !== undefined ? r[h] : '') + '</td>').join('') + '</tr>'
      ).join('');
      document.getElementById('empty-msg').style.display = filtered.length ? 'none' : 'block';
    }
    document.getElementById('search-box').addEventListener('input', draw);
    draw();
  }

  function renderAccessList(el) {
    el.innerHTML = '<div class="panel"><h3>Đang tải...</h3></div>';
    api('accesslist', currentAuth.email).then(res => {
      if (!res.success) { el.innerHTML = '<div class="panel">' + res.message + '</div>'; return; }
      el.innerHTML = `<div class="panel"><div class="tablewrap"><table><thead><tr>${res.headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead>
        <tbody>${res.rows.map(r => '<tr>' + res.headers.map(h => {
          if (h === 'Active') return '<td><span class="pill ' + (r[h] ? 'ok' : 'no') + '">' + (r[h] ? 'Active' : 'Khoá') + '</span></td>';
          return '<td>' + (r[h] !== undefined ? r[h] : '') + '</td>';
        }).join('') + '</tr>').join('')}</tbody></table></div></div>`;
    });
  }

  function renderAuditLog(el) {
    el.innerHTML = '<div class="panel"><h3>Đang tải...</h3></div>';
    api('auditlog', currentAuth.email).then(res => {
      if (!res.success) { el.innerHTML = '<div class="panel">' + res.message + '</div>'; return; }
      el.innerHTML = `<div class="panel"><div class="tablewrap"><table><thead><tr>${res.headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead>
        <tbody>${res.rows.map(r => '<tr>' + res.headers.map(h => '<td>' + (r[h] !== undefined ? r[h] : '') + '</td>').join('') + '</tr>').join('')}</tbody></table></div></div>`;
    });
  }

  // giữ phiên đăng nhập nếu reload trang
  auth.onAuthStateChanged(user => {
    if (user && !currentAuth) afterFirebaseLogin(user.email);
  });
</script>
</body>
</html>
